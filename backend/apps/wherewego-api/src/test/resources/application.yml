# 테스트 전용 application.yml.
# 운영 application.yml은 ${JWT_SECRET} 등 placeholder만 갖고 default가 없어
# 일반 @SpringBootTest 컨텍스트 로딩 시 long 변환 실패(NumberFormatException)와
# @Validated @NotBlank 위반이 발생한다.
# test classpath에서 본 파일이 운영 application.yml을 완전 대체하며 더미값을 부여해
# FlywayMigrationTest 등 환경변수 검증과 무관한 테스트가 컨텍스트를 띄울 수 있도록 한다.
#
# EnvBindingTest는 명시 args(--jwt.secret=, --jwt.secret=short 등)로 본 기본값을
# 덮어쓰므로 missing/short JWT 검증 케이스는 그대로 동작한다.
server:
  shutdown: graceful

spring:
  main:
    web-application-type: servlet
  application:
    name: wherewego-api
  profiles:
    active: test
  config:
    import:
      - jpa.yml
      - logging.yml
      - monitoring.yml

jwt:
  secret: test-dummy-jwt-secret-32chars-min-length
  access-ttl-seconds: 3600
  refresh-ttl-seconds: 1209600

kakao:
  local-api-key: test-kakao-local-api-key
  oauth:
    client-id: test-kakao-client-id
    client-secret: test-kakao-client-secret
    redirect-uri: https://example.com/oauth/kakao/callback
  local:
    base-url: https://dapi.kakao.com
    timeout-ms: 1500
  skill:
    secret: test-kakao-skill-secret
  callback:
    timeout-ms: 3000

place:
  instagram:
    scraping-enabled: true
  search:
    sync-deadline-ms: 4500
    kakao-local-size: 5
    google-sync-threshold-ms: 1700
  scraper:
    instagram:
      timeout-ms: 8000

bot:
  link-code:
    ttl-minutes: 10
    max-generation-retries: 5

mapbox:
  token: test-mapbox-token

google:
  places:
    api-key: test-google-places-api-key
    base-url: https://places.googleapis.com
    timeout-ms: 1500

web-security:
  cookie:
    secure: false
    domain: ""
    same-site: Lax
  cors:
    allowed-origins:
      - http://localhost:3000

---
spring:
  config:
    activate:
      on-profile: test
