# 테스트 전용 application.yml.
# 운영 application.yml은 ${JWT_SECRET} 등 placeholder만 갖고 default가 없어
# 일반 @SpringBootTest 컨텍스트 로딩 시 long 변환 실패(NumberFormatException)와
# @Validated @NotBlank 위반이 발생한다.
# test classpath에서 본 파일이 운영 application.yml을 완전 대체하며 더미값을 부여해
# FlywayMigrationTest 등 환경변수 검증과 무관한 테스트가 컨텍스트를 띄울 수 있도록 한다.
#
# EnvBindingTest는 명시 args(--jwt.secret=, --jwt.secret=short 등)로 본 기본값을
# 덮어쓰므로 missing/short JWT 검증 케이스는 그대로 동작한다.
server:
  shutdown: graceful

spring:
  main:
    web-application-type: servlet
  application:
    name: wherewego-api
  profiles:
    active: test
  config:
    import:
      - jpa.yml
      - logging.yml
      - monitoring.yml

jwt:
  secret: test-dummy-jwt-secret-32chars-min-length
  access-ttl-seconds: 3600
  refresh-ttl-seconds: 1209600

kakao:
  local-api-key: test-kakao-local-api-key
  oauth:
    client-id: test-kakao-client-id
    client-secret: test-kakao-client-secret
    redirect-uri: https://example.com/oauth/kakao/callback
    # P1: 네이티브 로그인 access_token_info app_id 대조용 더미값. 통합테스트 WireMock stub 도 이 값을 반환한다.
    app-id: 123456
  local:
    base-url: https://dapi.kakao.com
    timeout-ms: 1500
  skill:
    secret: test-kakao-skill-secret
  callback:
    timeout-ms: 3000

# P1: Apple 검증 더미값. jwks-url 은 AuthV1ControllerIntegrationTest 가 @DynamicPropertySource(WireMock) 로 override.
apple:
  audience: com.wherewego.app
  issuer: https://appleid.apple.com
  jwks-url: https://appleid.apple.com/auth/keys
  jwks-ttl-seconds: 21600

place:
  instagram:
    scraping-enabled: true
  search:
    sync-deadline-ms: 4500
    kakao-local-size: 5
    google-sync-threshold-ms: 1700
  scraper:
    instagram:
      timeout-ms: 8000
    gemini:
      enabled: false
      api-key: ""
      timeout-ms: 3000
      daily-quota-per-user: 50

bot:
  link-code:
    ttl-minutes: 10
    max-generation-retries: 5

mapbox:
  token: test-mapbox-token

# 초대 링크 레이트리밋: 컨트롤러 IT 가 동일 IP(127.0.0.1)에서 by-slug(GET)+accept(POST) 를
# 한 클래스 내 누적 호출(InviteLinkRateLimiter 는 싱글톤이라 @BeforeEach 로 리셋되지 않음)하므로,
# 정상 흐름 테스트가 레이트리밋에 걸리지 않도록 capacity 를 충분히 상향한다.
# 레이트리밋 동작 자체는 InviteLinkRateLimitFilterIT 가 @DynamicPropertySource 로 capacity 를 낮춰 검증한다.
# (운영 기본값 30 은 application.yml 에서 유지.)
app:
  invite:
    rate-limit:
      capacity: 1000

wherewego:
  s3:
    bucket: test-bucket
    region: ap-northeast-2
    public-base-url: https://test-bucket.s3.ap-northeast-2.amazonaws.com

google:
  places:
    api-key: test-google-places-api-key
    base-url: https://places.googleapis.com
    timeout-ms: 1500

web-security:
  cookie:
    secure: false
    domain: ""
    same-site: Lax
  cors:
    allowed-origins:
      - http://localhost:3000

---
spring:
  config:
    activate:
      on-profile: test
