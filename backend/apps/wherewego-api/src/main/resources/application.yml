server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: wherewego-api
  profiles:
    active: local
  config:
    import:
      - optional:file:.env[.properties]
      - jpa.yml
      - logging.yml
      - monitoring.yml
  task:
    scheduling:
      pool:
        # ThresholdMonitorScheduler가 previousGeminiSnapshot clear/putAll를 안전하게 수행하려면 단일 스레드 필요.
        # Spring Boot 기본값이지만 동작이 스케줄러 정합성에 의존하므로 명시한다.
        size: 1

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health, refresh
  endpoint:
    refresh:
      enabled: true

jwt:
  secret: ${JWT_SECRET}
  access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS}
  refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS}

kakao:
  local-api-key: ${KAKAO_LOCAL_API_KEY}
  oauth:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}
  local:
    base-url: https://dapi.kakao.com
    timeout-ms: 1500
  skill:
    secret: ${KAKAO_SKILL_SECRET}
  callback:
    timeout-ms: 3000

place:
  instagram:
    # 베타 운영 결정: 사용자 2명 규모 — true로 운영. 차단 사고 발생 시 환경변수로 false 토글 후 재기동.
    # Phase 2.6 B-2: @RefreshScope 적용 완료. application.yml 수정 후 POST /actuator/refresh 호출로 즉시 토글 가능.
    scraping-enabled: ${INSTAGRAM_SCRAPING_ENABLED:true}
  search:
    sync-deadline-ms: 4500
    kakao-local-size: 5
    google-sync-threshold-ms: 1700
  scraper:
    instagram:
      # sync-deadline-ms(4500)보다 작게 유지하여 stage별 컷오프가 데드라인 내에 동작하도록 한다.
      timeout-ms: 4000
    gemini:
      enabled: ${GEMINI_ENABLED:true}
      api-key: ${GEMINI_API_KEY:}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      timeout-ms: 3000
      daily-quota-per-user: ${GEMINI_DAILY_QUOTA_PER_USER:50}

bot:
  link-code:
    ttl-minutes: 10
    max-generation-retries: 5

chatbot:
  rate-limit:
    capacity: 10
    refill-seconds: 60
    max-keys: 10000
  instagram:
    # 인스타 링크 받은 후 메모 입력 대기 TTL. 만료 시 자동으로 메모 없이 저장.
    pending-ttl-seconds: ${CHATBOT_INSTAGRAM_PENDING_TTL_SECONDS:60}
    # 자동/메모 흐름으로 저장된 URL을 같은 사용자가 재전송했을 때 RESEND 안내를 띄울 윈도우.
    # 너무 길면 같은 인스타 게시물에 새 장소를 추가하려는 의도까지 차단된다.
    recently-saved-ttl-seconds: ${CHATBOT_INSTAGRAM_RECENTLY_SAVED_TTL_SECONDS:600}

mapbox:
  token: ${MAPBOX_TOKEN}

app:
  invite:
    # 초대 링크 TTL (ISO-8601 duration). 7일.
    ttl: ${APP_INVITE_TTL:P7D}
    # 단축 공유 URL 베이스. `${baseUrl}/invite/{slug}` 형태로 결합된다.
    share-base-url: ${APP_INVITE_SHARE_BASE_URL:http://localhost:3000}
    rate-limit:
      # /api/v1/groups/invite-links/by-slug/** 의 IP 분당 허용 요청 수.
      capacity: 30
      refill-seconds: 60
      max-keys: 10000

google:
  places:
    api-key: ${GOOGLE_PLACES_API_KEY}
    base-url: https://places.googleapis.com
    timeout-ms: 1500

web-security:
  cookie:
    secure: ${WEB_SECURITY_COOKIE_SECURE:true}
    domain: ${WEB_SECURITY_COOKIE_DOMAIN:}
    same-site: ${WEB_SECURITY_COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

slack:
  username: ${SLACK_USERNAME:wherewego-dev}
  channel: ${SLACK_CHANNEL:#wherewego-alerts}
  webhook-uri: ${SLACK_WEBHOOK_URI:}

monitoring:
  threshold:
    gemini:
      server-error-rate: 0.10
      cooldown-minutes: 5
    instagram:
      blocked-rate: 0.50
      cooldown-minutes: 5

---
spring:
  config:
    activate:
      on-profile: local, test

web-security:
  cookie:
    secure: false
    same-site: Lax
    domain: ""
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

chatbot:
  instagram:
    # 로컬/테스트도 운영과 동일한 1분 TTL 사용.
    pending-ttl-seconds: 60
    # 로컬/테스트는 빠른 검증을 위해 짧게 (60초).
    recently-saved-ttl-seconds: 60

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: prod

springdoc:
  api-docs:
    enabled: false
