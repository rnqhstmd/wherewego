server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: wherewego-api
  profiles:
    active: local
  config:
    import:
      - optional:file:.env[.properties]
      - jpa.yml
      - logging.yml
      - monitoring.yml
  task:
    scheduling:
      pool:
        # ThresholdMonitorScheduler가 previousGeminiSnapshot clear/putAll를 안전하게 수행하려면 단일 스레드 필요.
        # Spring Boot 기본값이지만 동작이 스케줄러 정합성에 의존하므로 명시한다.
        size: 1
  servlet:
    multipart:
      # Phase 13: 추억핀 사진 업로드. 클라 압축 후 2MB 이하지만 EXIF/메타 여유로 5MB 한도.
      # 컨트롤러에서 2MB 초과를 PIN_PHOTO_SIZE_EXCEEDED 로, 한도 초과는 advice 가 동일 코드로 매핑.
      max-file-size: 5MB
      max-request-size: 5MB

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health, refresh
  endpoint:
    refresh:
      enabled: true

jwt:
  secret: ${JWT_SECRET}
  access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS}
  refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS}

kakao:
  local-api-key: ${KAKAO_LOCAL_API_KEY}
  oauth:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    app-id: ${KAKAO_APP_ID}
  local:
    base-url: https://dapi.kakao.com
    timeout-ms: 1500
  skill:
    secret: ${KAKAO_SKILL_SECRET}
  callback:
    timeout-ms: 3000

apple:
  audience: ${APPLE_BUNDLE_ID}
  issuer: https://appleid.apple.com
  jwks-url: https://appleid.apple.com/auth/keys
  jwks-ttl-seconds: ${APPLE_JWKS_TTL_SECONDS:21600}

db:
  keep-warm:
    enabled: ${DB_KEEP_WARM_ENABLED:false}   # 기본 OFF. Neon 잔여 컴퓨트 확인 후 true.
    interval-ms: 240000                        # 4분 (< Neon suspend ~5분)
    active-start-hour: 7                        # 07시 KST
    active-end-hour: 23                         # 23시 KST (미만)
    zone: Asia/Seoul

place:
  instagram:
    # 베타 운영 결정: 사용자 2명 규모 — true로 운영. 차단 사고 발생 시 환경변수로 false 토글 후 재기동.
    # Phase 2.6 B-2: @RefreshScope 적용 완료. application.yml 수정 후 POST /actuator/refresh 호출로 즉시 토글 가능.
    scraping-enabled: ${INSTAGRAM_SCRAPING_ENABLED:true}
  search:
    sync-deadline-ms: 4500
    kakao-local-size: 5
    google-sync-threshold-ms: 1700
  scraper:
    instagram:
      # sync-deadline-ms(4500)보다 작게 유지하여 stage별 컷오프가 데드라인 내에 동작하도록 한다.
      timeout-ms: 4000
    gemini:
      enabled: ${GEMINI_ENABLED:true}
      api-key: ${GEMINI_API_KEY:}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      timeout-ms: 3000
      daily-quota-per-user: ${GEMINI_DAILY_QUOTA_PER_USER:50}

bot:
  link-code:
    ttl-minutes: 10
    max-generation-retries: 5

chatbot:
  rate-limit:
    capacity: 10
    refill-seconds: 60
    max-keys: 10000
  instagram:
    # 인스타 링크 받은 후 메모 입력 대기 TTL. 만료 시 자동으로 메모 없이 저장.
    pending-ttl-seconds: ${CHATBOT_INSTAGRAM_PENDING_TTL_SECONDS:60}
    # 자동/메모 흐름으로 저장된 URL을 같은 사용자가 재전송했을 때 RESEND 안내를 띄울 윈도우.
    # 너무 길면 같은 인스타 게시물에 새 장소를 추가하려는 의도까지 차단된다.
    recently-saved-ttl-seconds: ${CHATBOT_INSTAGRAM_RECENTLY_SAVED_TTL_SECONDS:600}
  reel:
    # Phase 12: 릴스 저장 선택 상태머신 세션 TTL.
    # 모든 단계(PROCESSING/MULTI_SELECTING/MEMO_WAITING) 동일 윈도우 (D-3, D-4).
    selection-ttl-seconds: ${CHATBOT_REEL_SELECTION_TTL_SECONDS:180}

mapbox:
  token: ${MAPBOX_TOKEN}

wherewego:
  s3:
    # Phase 13: 추억핀 사진 저장 버킷. EC2 IAM Role 자격증명(DefaultCredentialsProvider) 사용.
    bucket: ${S3_BUCKET}
    region: ${S3_REGION:ap-northeast-2}
    # 공개 GetObject URL 베이스. 응답 photoUrl = ${public-base-url}/${key}.
    public-base-url: ${S3_PUBLIC_BASE_URL}
  demo-seed:
    # P5 FR-25/BR-7/AC-21: 앱스토어 리뷰어 데모 계정·시드. 기본 OFF — enabled=true 일 때만 DemoSeedRunner 실행.
    # 자격증명(refresh-token/oauth-id)은 소스 비하드코딩(BR-7) — env(WHEREWEGO_DEMO_SEED_*)로만 주입.
    enabled: ${WHEREWEGO_DEMO_SEED_ENABLED:false}
    refresh-token: ${WHEREWEGO_DEMO_SEED_REFRESH_TOKEN:}
    group-name: ${WHEREWEGO_DEMO_SEED_GROUP_NAME:데모 커플}
    user1:
      oauth-provider: ${WHEREWEGO_DEMO_SEED_USER1_PROVIDER:KAKAO}
      oauth-id: ${WHEREWEGO_DEMO_SEED_USER1_OAUTH_ID:}
      nickname: ${WHEREWEGO_DEMO_SEED_USER1_NICKNAME:데모 사용자}
    user2:
      oauth-provider: ${WHEREWEGO_DEMO_SEED_USER2_PROVIDER:KAKAO}
      oauth-id: ${WHEREWEGO_DEMO_SEED_USER2_OAUTH_ID:}
      nickname: ${WHEREWEGO_DEMO_SEED_USER2_NICKNAME:데모 파트너}

app:
  invite:
    # 초대 링크 TTL (ISO-8601 duration). 7일.
    ttl: ${APP_INVITE_TTL:P7D}
    # 단축 공유 URL 베이스. `${baseUrl}/invite/{slug}` 형태로 결합된다.
    # 운영 기본값 = 서비스 도메인. 로컬 개발은 .env 에 APP_INVITE_SHARE_BASE_URL=http://localhost:3000 으로 override.
    share-base-url: ${APP_INVITE_SHARE_BASE_URL:https://wherewego.win}
    rate-limit:
      # by-slug(GET) + accept(POST) 초대 링크 경로의 IP 분당 허용 요청 수 (IP 예산 공유).
      capacity: 30
      refill-seconds: 60
      max-keys: 10000

google:
  places:
    api-key: ${GOOGLE_PLACES_API_KEY}
    base-url: https://places.googleapis.com
    timeout-ms: 1500

web-security:
  cookie:
    secure: ${WEB_SECURITY_COOKIE_SECURE:true}
    domain: ${WEB_SECURITY_COOKIE_DOMAIN:}
    same-site: ${WEB_SECURITY_COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

slack:
  username: ${SLACK_USERNAME:wherewego-dev}
  channel: ${SLACK_CHANNEL:#wherewego-alerts}
  webhook-uri: ${SLACK_WEBHOOK_URI:}

apns:
  # P2 PR-2: APNs(.p8 토큰 기반 푸시). 미설정 시 빈 값 → ApnsProperties.isConfigured()=false → graceful no-op.
  # 로컬/CI 에는 .p8 키가 주입되지 않으므로 푸시 전송이 비활성된다.
  key-id: ${APNS_KEY_ID:}
  team-id: ${APNS_TEAM_ID:}
  bundle-id: ${APNS_BUNDLE_ID:}
  # .p8 개인 키 PEM 문자열(개행 포함). Secret/env 로 주입.
  p8-key: ${APNS_P8_KEY:}
  production: ${APNS_PRODUCTION:false}

monitoring:
  threshold:
    gemini:
      server-error-rate: 0.10
      cooldown-minutes: 5
    instagram:
      blocked-rate: 0.50
      cooldown-minutes: 5

---
spring:
  config:
    activate:
      on-profile: local, test

# 로컬/테스트는 실제 Apple 번들 ID 미발급 상태이므로 기본값으로 컨텍스트 로딩을 허용한다.
# jwks-url 은 통합테스트가 @DynamicPropertySource(WireMock) 로 override 한다.
apple:
  audience: ${APPLE_BUNDLE_ID:com.wherewego.app}
  issuer: https://appleid.apple.com
  jwks-url: https://appleid.apple.com/auth/keys
  jwks-ttl-seconds: ${APPLE_JWKS_TTL_SECONDS:21600}

# 로컬/테스트는 실제 카카오 앱 ID 미발급 상태이므로 더미 기본값으로 컨텍스트 로딩을 허용한다.
kakao:
  oauth:
    app-id: ${KAKAO_APP_ID:0}

web-security:
  cookie:
    secure: false
    same-site: Lax
    domain: ""
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

chatbot:
  instagram:
    # 로컬/테스트도 운영과 동일한 1분 TTL 사용.
    pending-ttl-seconds: 60
    # 로컬/테스트는 빠른 검증을 위해 짧게 (60초).
    recently-saved-ttl-seconds: 60
  reel:
    # Phase 12: 로컬/테스트도 운영과 동일한 3분 TTL 사용.
    selection-ttl-seconds: 180

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: prod

springdoc:
  api-docs:
    enabled: false
