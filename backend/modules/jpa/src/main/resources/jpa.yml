spring:
  jpa:
    open-in-view: false
    generate-ddl: false
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_batch_fetch_size: 100
        timezone.default_storage: NORMALIZE_UTC
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

datasource:
  postgres-jpa:
    main:
      driver-class-name: org.postgresql.Driver
      jdbc-url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      username: ${POSTGRES_USER}
      password: "${POSTGRES_PASSWORD}"
      pool-name: postgres-main-pool
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 3000 # 커넥션 획득 대기시간(ms) ( default: 3000 = 3sec )
      validation-timeout: 5000 # 커넥션 유효성 검사시간(ms) ( default: 5000 = 5sec )
      keepalive-time: 0 # 커넥션 최대 생존시간(ms) ( default: 0 )
      max-lifetime: 1800000 # 커넥션 최대 생존시간(ms) ( default: 1800000 = 30min )
      leak-detection-threshold: 15000  # 커넥션 누수 감지 (15s 내 미반환 시 WARN 로그) — @Retryable worst case 32.8s 보다 짧게 잡아 진짜 leak 조기 감지 ( default: 0 = 비활성화 )
      initialization-fail-timeout: 1  # DB 연결 실패 시 즉시 예외 발생 ( default: -1 = 무한대기 )
      data-source-properties:
        reWriteBatchedInserts: true

---
spring.config.activate.on-profile: local

spring:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none

datasource:
  postgres-jpa:
    main:
      jdbc-url: jdbc:postgresql://localhost:5432/wherewego
      username: wherewego
      password: wherewego

---
spring.config.activate.on-profile: test

spring:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none

datasource:
  postgres-jpa:
    main:
      # 테스트 기본값. Testcontainers 사용 시 PostgresTestContainersConfig가 System property로 override.
      jdbc-url: jdbc:postgresql://localhost:5432/wherewego_test
      username: test
      password: test
      maximum-pool-size: 10
      minimum-idle: 5

---
spring.config.activate.on-profile: dev

spring:
  jpa:
    show-sql: true

datasource:
  postgres-jpa:
    main:
      # Supabase Session Pooler 사용 (port 5432, Flyway pg_advisory_lock 호환).
      # 정책 변경 (2024+): Direct connection (db.<ref>.supabase.co)은 IPv6 only가 되어 IPv4 환경에서
      #   connection refused. IPv4 호환을 위해 Session Pooler 사용 (또는 유료 IPv4 add-on 구매).
      # Transaction Pooler (port 6543) 사용 금지: Flyway pg_advisory_lock 비호환.
      # POSTGRES_HOST: aws-<n>-<region>.pooler.supabase.com (예: aws-1-ap-northeast-2.pooler.supabase.com)
      # POSTGRES_USER: postgres.<project-ref> (pooler 전용 사용자명)
      jdbc-url: jdbc:postgresql://${POSTGRES_HOST}:5432/${POSTGRES_DB}
      username: ${POSTGRES_USER}
      password: "${POSTGRES_PASSWORD}"
      maximum-pool-size: 10
      minimum-idle: 5
      data-source-properties:
        reWriteBatchedInserts: true
        ssl: true
        sslmode: require

---
spring.config.activate.on-profile: prod

datasource:
  postgres-jpa:
    main:
      # Neon Pooler 사용 (port 5432, Flyway pg_advisory_lock 호환).
      # POSTGRES_HOST: ep-<name>-pooler.c-2.ap-southeast-1.aws.neon.tech 형식
      # POSTGRES_USER: neondb_owner
      jdbc-url: jdbc:postgresql://${POSTGRES_HOST}:5432/${POSTGRES_DB}
      username: ${POSTGRES_USER}
      password: "${POSTGRES_PASSWORD}"
      maximum-pool-size: 10
      minimum-idle: 0           # Neon suspend 시 stale 커넥션 방지 (idle 유지 안 함)
      connection-timeout: 10000 # Neon cold start(3~8초) 대응
      data-source-properties:
        reWriteBatchedInserts: true
        ssl: true
        sslmode: require
        channel_binding: require
