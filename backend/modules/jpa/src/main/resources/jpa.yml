spring:
  jpa:
    open-in-view: false
    generate-ddl: false
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_batch_fetch_size: 100
        timezone.default_storage: NORMALIZE_UTC
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

datasource:
  postgres-jpa:
    main:
      driver-class-name: org.postgresql.Driver
      jdbc-url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      username: ${POSTGRES_USER}
      password: "${POSTGRES_PASSWORD}"
      pool-name: postgres-main-pool
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 3000 # 커넥션 획득 대기시간(ms) ( default: 3000 = 3sec )
      validation-timeout: 5000 # 커넥션 유효성 검사시간(ms) ( default: 5000 = 5sec )
      keepalive-time: 0 # 커넥션 최대 생존시간(ms) ( default: 0 )
      max-lifetime: 1800000 # 커넥션 최대 생존시간(ms) ( default: 1800000 = 30min )
      leak-detection-threshold: 0  # 커넥션 누수 감지 (주어진 ms 내에 반환 안 하면 로그 경고) ( default: 0 = 비활성화 )
      initialization-fail-timeout: 1  # DB 연결 실패 시 즉시 예외 발생 ( default: -1 = 무한대기 )
      data-source-properties:
        reWriteBatchedInserts: true

---
spring.config.activate.on-profile: local

spring:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none

datasource:
  postgres-jpa:
    main:
      jdbc-url: jdbc:postgresql://localhost:5432/wherewego
      username: wherewego
      password: wherewego

---
spring.config.activate.on-profile: test

spring:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none

datasource:
  postgres-jpa:
    main:
      maximum-pool-size: 10
      minimum-idle: 5

---
spring.config.activate.on-profile: dev

spring:
  jpa:
    show-sql: true

datasource:
  postgres-jpa:
    main:
      # Supabase port 5432 강제 (direct connection). PgBouncer transaction-mode(6543) 사용 금지.
      # 6543 사용 시 Flyway pg_advisory_lock 미호환으로 마이그레이션 실패.
      jdbc-url: jdbc:postgresql://${POSTGRES_HOST}:5432/${POSTGRES_DB}
      username: ${POSTGRES_USER}
      password: "${POSTGRES_PASSWORD}"
      maximum-pool-size: 10
      minimum-idle: 5
      data-source-properties:
        reWriteBatchedInserts: true
        ssl: true
        sslmode: require

---
spring.config.activate.on-profile: prod

datasource:
  postgres-jpa:
    main:
      # Supabase port 5432 강제 (direct connection). PgBouncer transaction-mode(6543) 사용 금지.
      # 6543 사용 시 Flyway pg_advisory_lock 미호환으로 마이그레이션 실패.
      jdbc-url: jdbc:postgresql://${POSTGRES_HOST}:5432/${POSTGRES_DB}
      username: ${POSTGRES_USER}
      password: "${POSTGRES_PASSWORD}"
      maximum-pool-size: 10
      minimum-idle: 5
      data-source-properties:
        reWriteBatchedInserts: true
        ssl: true
        sslmode: require
