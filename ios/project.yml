name: WhereWeGo
options:
  deploymentTarget: { iOS: "17.0" }
  bundleIdPrefix: com.wherewego
configs: { Debug: debug, Release: release }
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  KakaoOpenSDK:
    url: https://github.com/kakao/kakao-ios-sdk
    exactVersion: "2.24.5"
  # Mapbox iOS SDK — secret download token(.netrc, Downloads:Read) 발급 후 아래 주석 해제:
  #   MapboxMaps:
  #     url: https://github.com/mapbox/mapbox-maps-ios
  #     from: "11.0.0"
  # 그리고 targets.WhereWeGo.dependencies 에 추가:
  #   - { package: MapboxMaps, product: MapboxMaps }
targets:
  WhereWeGo:
    type: application
    platform: iOS
    sources:
      - path: WhereWeGo
    # Push Notifications(aps-environment) + Associated Domains(applinks) capability.
    # entitlements 파일에 키를 두고 경로만 지정 — XcodeGen 이 CODE_SIGN_ENTITLEMENTS 로 배선.
    entitlements:
      path: WhereWeGo/WhereWeGo.entitlements
    info:
      path: WhereWeGo/Info.plist
      properties:
        # 스플래시(FR-24) — 크림 배경(LaunchBackground colorset, #FAF8F5 디자인 토큰).
        # 최종 로고/스플래시 에셋 교체는 P6 범위(비차단).
        UILaunchScreen:
          UIColorName: LaunchBackground
        # 원격 푸시(APNs) 수신용 백그라운드 모드(FR-17).
        UIBackgroundModes:
          - remote-notification
        UIAppFonts:
          - NotoSerifKR-Regular.otf
          - GowunBatang-Regular.ttf
          - Pretendard-Regular.otf
          - JetBrainsMono-Regular.ttf
        NSLocationWhenInUseUsageDescription: "근처에 어떤 핀이 있는지 보여드릴게요"
        NSCameraUsageDescription: "사진을 직접 찍어 추억으로 남길 수 있어요"
        NSPhotoLibraryUsageDescription: "추억 사진을 선택해 핀에 남길 수 있어요"
        # 로컬 백엔드(http://localhost) 접속 허용 — loopback/.local 만 예외이며 prod https 에는 영향 없음.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        API_BASE_URL: $(API_BASE_URL)
        KAKAO_NATIVE_APP_KEY: $(KAKAO_NATIVE_APP_KEY)
        MAPBOX_ACCESS_TOKEN: $(MAPBOX_ACCESS_TOKEN)
        MAPBOX_STYLE_URL: $(MAPBOX_STYLE_URL)
        # 데모 로그인 refreshToken(FR-26/BR-7/AC-21) — xcconfig DEMO_REFRESH_TOKEN 주입. AppConfig.demoRefreshToken 이 읽음.
        DEMO_REFRESH_TOKEN: $(DEMO_REFRESH_TOKEN)
        # Universal Links 도메인(FR-20) — xcconfig APP_LINKS_DOMAIN 주입. AppConfig.appLinksDomain 이 읽음.
        APP_LINKS_DOMAIN: $(APP_LINKS_DOMAIN)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - kakao$(KAKAO_NATIVE_APP_KEY)
        LSApplicationQueriesSchemes:
          - kakaokompassauth
          - kakaolink
    dependencies:
      - { package: KakaoOpenSDK, product: KakaoSDKAuth }
      - { package: KakaoOpenSDK, product: KakaoSDKUser }
      - { package: KakaoOpenSDK, product: KakaoSDKCommon }
  WhereWeGoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WhereWeGoTests
    # 프로젝트 레벨 configFile(Shared.xcconfig)의 PRODUCT_NAME=WhereWeGo 상속을 차단한다.
    # 미설정 시 테스트 번들이 WhereWeGo.swiftmodule 을 생성해 메인 타깃과 산출물 경로가 충돌한다
    # (Multiple commands produce ...). 테스트 타깃 고유 이름으로 분리.
    settings:
      base:
        PRODUCT_NAME: WhereWeGoTests
        PRODUCT_MODULE_NAME: WhereWeGoTests
        PRODUCT_BUNDLE_IDENTIFIER: com.wherewego.app.tests
    dependencies:
      - { target: WhereWeGo }
schemes:
  WhereWeGo:
    build:
      targets:
        WhereWeGo: all
        WhereWeGoTests: [test]
    test:
      config: Debug
      targets:
        - WhereWeGoTests
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
