name: Deploy to EC2

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/wherewego-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build JAR
        working-directory: backend
        run: ./gradlew :apps:wherewego-api:bootJar -x test

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          GH_PAT: ${{ secrets.GH_PAT }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ENV_FILE,GH_PAT
          script: |
            # .env 갱신
            sudo mkdir -p /etc/wherewego
            printf '%s' "$ENV_FILE" | sudo tee /etc/wherewego/.env > /dev/null
            sudo chown "$USER:$USER" /etc/wherewego/.env
            sudo chmod 600 /etc/wherewego/.env

            # ghcr.io 로그인 후 이미지 pull
            echo "$GH_PAT" | docker login ghcr.io -u rnqhstmd --password-stdin
            docker pull ${{ env.IMAGE }}:latest

            # 컨테이너 교체
            docker stop wherewego-api || true
            docker rm   wherewego-api || true
            docker run -d \
              --name wherewego-api \
              --env-file /etc/wherewego/.env \
              -p 8080:8080 \
              --restart unless-stopped \
              ${{ env.IMAGE }}:latest

            # 미사용 이미지 정리
            docker image prune -f
