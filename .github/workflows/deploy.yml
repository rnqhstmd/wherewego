name: Deploy to EC2

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/wherewego-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build JAR
        working-directory: backend
        run: ./gradlew :apps:wherewego-api:bootJar -x test

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync secrets to SSM Parameter Store
        run: |
          aws ssm put-parameter \
            --name "/wherewego/env" \
            --value "${{ secrets.ENV_FILE }}" \
            --type "SecureString" \
            --overwrite

          aws ssm put-parameter \
            --name "/wherewego/gh-pat" \
            --value "${{ secrets.GH_PAT }}" \
            --type "SecureString" \
            --overwrite

      - name: Deploy to EC2 via SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          IMAGE: ${{ env.IMAGE }}
        run: |
          COMMANDS=$(jq -n --arg img "$IMAGE" '[
            "set -e",
            "GH_PAT=$(aws ssm get-parameter --name /wherewego/gh-pat --with-decryption --query Parameter.Value --output text)",
            "aws ssm get-parameter --name /wherewego/env --with-decryption --query Parameter.Value --output text > /tmp/wherewego_env",
            "chmod 600 /tmp/wherewego_env && mv /tmp/wherewego_env /etc/wherewego/.env",
            "echo \"$GH_PAT\" | docker login ghcr.io -u rnqhstmd --password-stdin",
            ("docker pull " + $img + ":latest"),
            "docker stop wherewego-api || true",
            "docker rm wherewego-api || true",
            ("docker run -d --name wherewego-api --env-file /etc/wherewego/.env -e JAVA_TOOL_OPTIONS=\"-Xmx512m -Xms256m\" -p 8080:8080 --memory 700m --restart unless-stopped " + $img + ":latest"),
            "docker image prune -f"
          ]')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ github.sha }}" \
            --parameters "{\"commands\": $COMMANDS}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "[$i/30] $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "배포 완료"
              exit 0
            elif [[ "$STATUS" =~ ^(Failed|TimedOut|Cancelled|DeliveryTimedOut)$ ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi
            sleep 10
          done
          exit 1
